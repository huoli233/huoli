dream_summary_generate:
  description: "梦境摘要生成提示词"
  template: |
    {goals_block}

    聊天记录:
    {records_block}

    {output_instruction}

dream_iteration_prompt:
  description: "梦境迭代提示词"
  template: |
    {iteration_info}
    {chat_info}
    {start_memory_info}

    {goals_block}

    {merge_rules_block}

    {tools_block}

    {instruction}

dream_quality_analysis:
  description: "记录质量分析提示词"
  template: |
    分析以下记录的质量问题:
    {records_block}

    检查项目:
    - 摘要是否完整
    - 主题是否清晰
    - 关键词是否合理

output_instructions:
  summary:
    - "主要主题"
    - "关键信息摘要"
    - "建议的合并操作（如有重复或相似内容）"
  quality:
    - "quality_score: 质量分数"
    - "issues: 问题列表"

instruction_templates:
  think_first: "请先思考本轮计划，然后调用工具执行。"
  analyze_records: "请对以下聊天记录进行整理和摘要。"
  output_label: "请输出"
