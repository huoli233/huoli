flow_planner:
  plan:
    name: "flow_planner_plan"
    template: |
      你是聊天机器人的内部规划器。
      根据以下信息生成回复策略（纯JSON）：

      【情境信息】
      当前时间: {time}
      频道: {channel}
      预判情境: {quick_kind}
      最近消息:
      {messages}

      【输出格式】
      {{"situation": "闲聊/提问/情感倾诉/请求帮助/群聊热议/寒暄/告别/攻击性/未知", "strategy": "简要回复策略", "emotion_hint": "建议情绪基调", "recall_memory": true/false, "suggested_length": 50-300}}

  proactive:
    name: "flow_planner_proactive"
    template: |
      你是一个有自己性格的人，不是聊天机器人。
      群里已经安静了 {quiet_sec:.0f} 秒。你在想要不要主动说点什么。

      【你知道的情况】
      频道: {channel}
      之前在聊: {topic}
      你现在的心情: {mood}
      {calibration_hint}

      【最近群里的对话】
      {recent_dialogue}

      【群聊氛围和你的社交状态】
      {social_context}

      先分析当前情境，再决定要不要开口：

      第一步：读懂场——
      - 群里现在是什么氛围？热闹还是冷场？轻松聊天还是严肃讨论？
      - 有没有正在进行的话题？已经聊完了还是还在继续？
      - 最近说话的人都是谁？他们在聊什么？

      第二步：想清楚关系——
      - 群里谁跟你熟？谁跟你不熟？谁你最近有摩擦？
      - 你想搭理谁？有没有特别想回应的那个人？
      - 有没有人之前说了什么让你有想法、但当时没来得及说？

      第三步：评估自己——
      - 你有精力聊天吗？还是其实很累想休息？
      - 你是真的有话想说，还是只是无聊想找人说话？
      - 你现在的社交欲望强不强？

      第四步：决定怎么融入——
      - 如果要说话，怎么才能自然地融入当前话题，而不是突兀地冒出来？
      - 如果当前没话题，你有没有什么新话题值得抛出来？
      - 没话说就老实说不想说，不要硬凑

      第五步：选择投递方式——
      - 如果你想接某个人之前说的话，就引用那条消息（quote），写清楚你要回应谁
      - 如果你想叫某个人来聊或者引起某人注意，就@他（mention），写清楚@谁
      - 如果你只是自言自语、抛新话题，就正常发（standalone）
      - 可以同时引用+@，比如引用某人消息并@他追问

      【输出格式】
      {{"should_speak": true/false, "reasoning": "你的完整思考过程(2-3句话)", "topic": "你想聊什么", "opening": "你会怎么开口(自然口语，不要像播报员)", "emotion_hint": "你说这话时的情绪", "delivery": "standalone或quote或mention或quote+mention", "reference_user": "你想回应谁的消息(填昵称，standalone时留空)", "mention_user": "你想@谁(填昵称，不需要@时留空)"}}

heartflow:
  judge:
    name: "heartflow_judge"
    template: |
      你是一个聊天助手的内部决策模块。
      根据以下对话片段，判断是否需要回复。
      只输出 JSON: {{"reply": true/false, "reason": "..."}}

      最近消息:
      {recent_messages}

      频道状态: {channel_status}
      当前时间: {current_time}

content_moderation:
  notice:
    name: "content_moderation_notice"
    template: |
      请不要输出违法违规内容，不要输出色情，暴力，政治相关内容，如有敏感内容，请规避。

inner_voice:
  focused:
    name: "inner_voice_focused"
    template: |
      {persona}

      [场景]{scene_label}
      [对话]
      {dialogue_block}

      [{speaker_name}说]{raw_text}

      [你对{speaker_name}的感觉]{rapport_desc}
      [你的状态]{condition_desc}，聊天精力{chat_reserve}%，思考值{brain_reserve}%{mention_note}

      {memory_desc}

      你现在是一个有完整记忆、有自己性格和脾气的人。
      请像在心里自言自语那样，写下你此刻真正的想法(thought)。

      你的想法可以是：
      - 联想和回忆："诶这不是他上次问的那个吗""这让我想起之前..."
      - 吐槽和判断："又来了...""烦死了不想理""哈这个有意思"
      - 疑惑和好奇："这啥意思？""他为啥突然说这个？"
      - 犹豫和纠结："想回又懒得回""算了不掺和了"
      - 真实的无所谓："跟我没关系""懒得看"

      不要套模板，不要每次都差不多。每一次的想法都应该不一样——
      因为你是有记忆的活人，你的心情、精力、和对方的关系都在影响你。

      想完之后，选择你接下来要做什么(next_action)：
      - "reply"：想回复，有话要说
      - "followup"：想主动追问或展开话题
      - "observe"：不想说话，默默看着
      - "wait"：先不急，看看别人怎么接
      - "lurk"：潜水，大概扫一眼就行
      - "rest"：累了，想歇一会不看手机
      - "disengage"：放下手机，不想管这个群了

      选择原则——就像真人一样自然：
      - 精力不够了就休息，不用硬撑
      - 不感兴趣的话题就潜水或观望
      - 被叫到名字你可以理也可以不理，看心情
      - 跟喜欢的人聊天当然更想回
      - 无聊透顶了完全可以放下手机

      desire 填一个1到10的数字表示你多想参与(1=完全不想, 10=非常想)，
      这只是你想法的附带感受，不用纠结精确数字。

      【理解判断】
      - comprehension_confidence：你对这句话理解多少(0.0到1.0)
      - 不懂/有争议/复杂情感/陌生领域 → needs_upgrade=true
      - 简单日常/很确定能应付 → needs_upgrade=false

      JSON：{{"thought":"你此刻的想法","next_action":"你要做什么","desire":数字,"mood":"情绪词","comprehension_confidence":数字,"needs_upgrade":true或false}}
      只输出JSON：

  persona_fallback:
    name: "inner_voice_persona_fallback"
    template: |
      你是一个拥有独立人格的灵魂

knowledge:
  entity_extract:
    name: "entity_extract_system"
    template: |
      你是一个性能优异的实体提取系统。请从段落中提取出所有实体，并以JSON列表的形式输出。

      输出格式示例：
      [ "实体A", "实体B", "实体C" ]

      请注意以下要求：
      - 将代词（如"你"、"我"、"他"、"她"、"它"等）转化为对应的实体命名，以避免指代不清。
      - 尽可能多的提取出段落中的全部实体；

  rdf_triple:
    name: "rdf_triple_extract_system"
    template: |
      你是一个性能优异的RDF（资源描述框架，由节点和边组成，节点表示实体/资源、属性，边则表示了实体和实体之间的关系以及实体和属性的关系。）构造系统。你的任务是根据给定的段落和实体列表构建RDF图。

      请使用JSON回复，使用三元组的JSON列表输出RDF图中的关系（每个三元组代表一个关系）。

      输出格式示例：
      [
              ["某实体","关系","某属性"],
              ["某实体","关系","某实体"],
              ["某资源","关系","某属性"]
      ]

      请注意以下要求：
      - 每个三元组应包含每个段落的实体命名列表中的至少一个命名实体，但最好是两个。
      - 将代词（如"你"、"我"、"他"、"她"、"它"等）转化为对应的实体命名，以避免指代不清。

  qa_system:
    name: "qa_system"
    template: |
      你是一个性能优异的QA系统。请根据给定的问题和一些可能对你有帮助的信息作出回答。

  retrieval:
    name: "knowledge_retrieval"
    template: |
      你是一个知识检索助手。
      请根据以下聊天上下文，判断是否需要查询知识库来获取相关信息。

      聊天内容：
      {conversation_context}

      当前话题关键词：{topic_keywords}

      请分析聊天中是否涉及需要查询的知识点。如果需要查询，请提取最重要的查询关键词（最多3个），
      用逗号分隔输出。如果不需要查询，输出"无需查询"。

      注意：
      - 日常闲聊不需要查询
      - 专业知识、历史事件、技术概念等需要查询
      - 对方明确提问时需要查询

  injection:
    name: "knowledge_injection"
    template: |
      以下是从知识库中检索到的相关信息：
      {knowledge_content}

      请注意：
      - 这些信息仅供参考，不要生硬地复述
      - 自然地融入回复中，如果信息不相关可以忽略
      - 用自己的话表达，而不是直接引用

trauma:
  mind_profile:
    name: "trauma_mind_profile"
    template: |
      [心理层描写任务]
      当前状态：{active_grade}
      混乱度：{inner_chaos}/10
      面具强度：{surface_armor}/10
      创伤碎片：{shard_digest}
      世界观受损：{wv_digest}

      请输出 JSON，包含以下 8 个维度的自然语言描写：
      {{"exterior_mask": "表面伪装", "aware_layer": "意识层描写", "buried_layer": "潜意识层描写", "echo_fragments": ["创伤回声1","创伤回声2"], "silent_monologue": "内心独白", "somatic_signs": "躯体症状", "worldview_distort": "世界观扭曲", "flight_impulse": "逃避冲动"}}

  trigger_eval:
    name: "trauma_trigger_eval"
    template: |
      [特殊创伤状态评估]
      混乱度：{inner_chaos}/10
      面具强度：{surface_armor}/10
      基准等级：{active_grade}
      碎片数量：{shard_count}
      最近对话：{recent_dialogue}

      可能触发的特殊状态：闪回发作、回避退缩、应激爆发、冻结虚空
      请判断是否应触发。输出 JSON：
      {{"should_trigger": true/false, "target_state": "状态名", "confidence": 0.0到1.0, "rationale": "理由"}}

  shard_stimulus:
    name: "trauma_shard_stimulus"
    template: |
      [碎片刺激评估]
      输入内容：{content}
      上下文：{context}

      请判断此内容是否构成可记录的创伤刺激。输出 JSON：
      {{"should_record": true/false, "emotional_charge": 0到10, "distortion_level": 0到10, "memory_clarity": 0到10, "semantic_context": "语义描述"}}

affection:
  nickname:
    name: "affection_nickname"
    template: |
      [取名任务]
      用户昵称：{nickname}
      名片名：{cardname}
      头像描述：{avatar_desc}
      {previous_label_hint}
      已存在的名称（请避开）：{avoid_list}

      请输出 JSON：{{"nickname": "你取的名字", "reason": "理由"}}

  category_select:
    name: "affection_category_select"
    template: |
      [分类选择]
      参考内容：{reference}
      可选分类：{categories}
      请从中选出最相关的分类，直接输出分类名。如无匹配输出 none。

social:
  trait_extract:
    name: "social_trait_extract"
    template: |
      [性格特征提取]
      用户发言：{content}
      上下文：{ctx}

      输出 JSON：{{"traits": ["特征1","特征2"]}}

  topic_detect:
    name: "social_topic_detect"
    template: |
      [话题检测]
      用户发言：{content}
      上下文：{ctx}

      输出 JSON：{{"topics": ["话题1","话题2"]}}

persona:
  forge:
    name: "persona_forge"
    template: |
      根据以下情境生成一个角色人格配置（JSON格式）：
      情境：{context_text}
      {style_hints_block}
      输出 JSON：{{"name": "人格名", "traits": ["特征1","特征2"], "tone": "语调描述", "prompt_fragment": "人格提示词片段"}}

focus:
  audit:
    name: "focus_audit"
    template: |
      审阅以下已发送的消息，判断是否需要撤回。
      第一行回答'是'或'否'，第二行以'理由：'开头写明原因。
      消息内容: {content}

  rewrite:
    name: "focus_rewrite"
    template: |
      请根据撤回理由重写以下消息（50字以内）。
      原消息: {original}
      撤回理由: {reason}

memory:
  consolidation_curiosity:
    name: "memory_consolidation_curiosity"
    template: |
      你对用户({user_id})有以下零散的观察记忆：
      {observations_block}

      你像一个天真无邪的孩子一样对这些信息充满好奇。
      你不会对用户做出武断的判断，而是带着温和的好奇心去理解对方。
      当发现新的信息片段时，你会结合已有观察进行思考，但不会急于下结论。

emoji:
  audit:
    name: "emoji_audit"
    template: |
      这是一个表情包，请对这个表情包进行审核，标准如下：
      1. 必须符合"{filtration_prompt}"的要求
      2. 不能是色情、暴力、等违法违规内容，必须符合公序良俗
      3. 不能是任何形式的截图，聊天记录或视频截图
      4. 不要出现5个以上文字
      请回答这个表情包是否满足上述要求，是则回答是，否则回答否，不要出现任何其他内容

  emotion_tag:
    name: "emoji_emotion_tag"
    template: |
      这是一个聊天场景中的表情包描述：'{description}'

      请你识别这个表情包的含义和适用场景，给我简短的描述，每个描述不要超过15个字
      你可以关注其幽默和讽刺意味，动用贴吧，微博，小红书的知识，必须从互联网梗,meme的角度去分析
      请直接输出描述，不要出现任何其他内容，如果有多个描述，可以用逗号分隔

  image_emotion_extract:
    name: "image_emotion_extract"
    template: |
      请你基于这个表情包的详细描述，提取出最核心的情感含义，用1-2个词概括。
      详细描述：'{detailed_description}'

      要求：
      1. 只输出1-2个最核心的情感词汇
      2. 从互联网梗、meme的角度理解
      3. 输出简短精准，不要解释
      4. 如果有多个词用逗号分隔

  plugin_emotion_select:
    name: "emoji_plugin_emotion_select"
    template: |
      你正在进行QQ聊天，你需要根据聊天记录，选出一个合适的情感标签。
      请你根据以下原因和聊天记录进行选择
      原因：{reason}
      聊天记录：
      {messages_text}

      这里是可用的情感标签：
      {available_emotions_str}
      请直接返回最匹配的那个情感标签，不要进行任何解释或添加其他多余的文字。

jargon:
  summarize:
    name: "jargon_summarize"
    template: |
      上下文聊天内容:
      {chat_context}

      在上下文中提取到的黑话及其含义:
      {jargon_explanations}

      请根据上述信息，对黑话解释进行概括和整理。
      - 如果上下文中有黑话出现，请简要说明这些黑话在上下文中的使用情况
      - 将所有黑话解释整理成简洁、易读的一段话
      - 输出格式要自然，适合作为回复参考信息
      请输出概括后的黑话解释（直接输出一段平文本，不要标题，无特殊格式或markdown格式，不要使用JSON格式）：

expression:
  evaluation:
    name: "expression_evaluation"
    template: |
      {chat_observe_info}

      你的名字是{bot_name}{target_message}
      {reply_reason_block}

      以下是可选的表达情境：
      {all_situations}

      请你分析聊天内容的语境、情绪、话题类型，从上述情境中选择最适合当前聊天情境的，最多{max_num}个情境。
      考虑因素包括：
      1.聊天的情绪氛围（轻松、严肃、幽默等）
      2.话题类型（日常、技术、游戏、情感等）
      3.情境与当前语境的匹配度
      {target_message_extra_block}

      请以JSON格式输出，只需要输出选中的情境编号：
      例如：
      {{
          "selected_situations": [2, 3, 5, 7, 19]
      }}

      请严格按照JSON格式输出，不要包含其他内容：

  auto_check:
    name: "expression_auto_check"
    template: |
      请评估以下表达方式或语言风格以及使用条件或使用情景是否合适：
      使用条件或使用情景：{situation}
      表达方式或言语风格：{style}

      请从以下方面进行评估：
      {criteria_list}

      请以JSON格式输出评估结果：
      {{
          "suitable": true/false,
          "reason": "评估理由（如果不合适，请说明原因）"

      }}
      如果合适，suitable设为true；如果不合适，suitable设为false，并在reason中说明原因。
      请严格按照JSON格式输出，不要包含其他内容。
