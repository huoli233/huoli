model_fail_threshold = 3
# 聊天流自动保存间隔（秒）
autosave_interval_seconds = 300
# 遥测心跳间隔（秒）
heartbeat_interval_seconds = 300
# 任务取消等待超时（秒）
task_cancel_timeout_seconds = 5.0
# 全部任务关停等待超时（秒）
task_shutdown_timeout_seconds = 10.0
# 心流增强循环：最小 tick 间隔（秒）
heartfc_tick_floor_sec = 0.15
# 心流增强循环：休眠轮询间隔（秒）
heartfc_dormant_poll_sec = 1.0
# 感知冷却间隔（秒）
heartfc_perception_cooldown_sec = 5.0
# 内心独白冷却间隔（秒）
heartfc_voice_cooldown_sec = 6.0
