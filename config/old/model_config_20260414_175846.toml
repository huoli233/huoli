[model_task_config.utils] # 通用轻量模型：表情包、取名、关系、情绪变化等组件使用
model_list = ["gemma-3-4b", "gemma-3-1b", "gemma-3-27b"] # 小模型快速处理
temperature = 0.2
max_tokens = 4096
slow_threshold = 15.0
selection_strategy = "random"

[model_task_config.tool_use] # 功能模型，需要使用支持工具调用的模型，请使用较快的小模型（调用量较大）
model_list = ["gemma-3-27b", "gemma-4-31b", "gemma-3-4b"]
temperature = 0.7
max_tokens = 1024
slow_threshold = 10.0
selection_strategy = "random"

[model_task_config.replyer] # 首要回复模型 - 所有聊天模型轮询，省小模型给其他任务
model_list = ["gemini-2.5-flash", "gemini-3-flash", "grok-4.20-chat", "grok-4.20-reasoning", "glm5", "claude", "kimi-k2.5", "minimax-m2.7", "deepseek-v3.2", "gemma-4-31b", "gemma-3-27b"]
temperature = 0.3
max_tokens = 2048
slow_threshold = 25.0
selection_strategy = "random"

[model_task_config.planner] # 决策：负责决定何时回复 - 小模型快速决策，省大模型token
model_list = ["gemma-3-4b", "gemma-3-27b", "gemma-3-1b"]
temperature = 0.3
max_tokens = 800
slow_threshold = 12.0
selection_strategy = "random"

[model_task_config.vlm] # 图像识别模型
model_list = ["qwen3-vl-30"]
max_tokens = 256
slow_threshold = 15.0
selection_strategy = "random"

[model_task_config.voice] # 语音识别模型
model_list = ["sensevoice-small"]
slow_threshold = 12.0
selection_strategy = "random"

# 嵌入模型
[model_task_config.embedding]
model_list = ["bge-m3"]
slow_threshold = 5.0
selection_strategy = "random"

# ------------LPMM知识库模型------------

[model_task_config.lpmm_entity_extract] # 实体提取模型 - 中型模型处理
