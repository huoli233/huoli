[model_task_config.utils] # 在麦麦的一些组件中使用的模型，例如表情包模块，取名模块，关系模块，麦麦的情绪变化等，是麦麦必须的的模型
model_list = ["qwen3-0.6b"] # 只用本地小模型，快！
temperature = 0.2
max_tokens = 2048                         # 减少token，加快速度
slow_threshold = 15.0                     # 本地模型15秒算慢
selection_strategy = "random"

[model_task_config.tool_use] #功能模型，需要使用支持工具调用的模型，请使用较快的小模型（调用量较大）
model_list = ["qwen3-0.6b"] # 只用本地小模型，快！
temperature = 0.4
max_tokens = 1024
slow_threshold = 10.0                     # 本地模型15秒算慢
selection_strategy = "random"

[model_task_config.model_monitor] # 模型驱动监控系统（后台小模型）
model_list = ["qwen3-0.6b"]  # 纯本地LMStudio小模型
temperature = 0.7
max_tokens = 2048                           # 减少token
slow_threshold = 15.0                       # 本地模型15秒算慢
selection_strategy = "random"

[model_task_config.replyer] # 首要回复模型，还用于表达方式学习
model_list = ["gemini-3.1-flash-lite-preview", "gemini-3-flash"] # 减少到2个，快！
temperature = 0.3
max_tokens = 2048
slow_threshold = 25.0                     # 30秒算慢
selection_strategy = "random"

[model_task_config.planner] #决策：负责决定麦麦该什么时候回复的模型
model_list = ["qwen3-0.6b"] # 只用本地小模型决策，快！
temperature = 0.3
max_tokens = 512                            # 减少token，更快
slow_threshold = 10.0                       # 决策10秒算慢
selection_strategy = "random"

[model_task_config.vlm] # 图像识别模型
model_list = ["gemini-3.1-flash-lite-preview"] # 只用1个，减少选择时间
max_tokens = 256
slow_threshold = 15.0
selection_strategy = "random"

[model_task_config.voice] # 语音识别模型
model_list = ["gemini-3-flash"]
slow_threshold = 12.0
selection_strategy = "random"           # 模型选择策略：balance（负载均衡）或 random（随机选择）

# 嵌入模型
[model_task_config.embedding]
model_list = ["bge-m3"]
slow_threshold = 5.0
selection_strategy = "random"           # 模型选择策略：balance（负载均衡）或 random（随机选择）

[model_task_config.focus_chat]
model_list = ["qwen3-0.6b"]
temperature = 0.7
max_tokens = 1024
slow_threshold = 60.0
selection_strategy = "random"

[model_task_config.lightweight]
model_list = ["qwen3-0.6b"]
temperature = 0.3
max_tokens = 1024
slow_threshold = 60.0
selection_strategy = "random"

# ------------LPMM知识库模型------------

[model_task_config.lpmm_entity_extract] # 实体提取模型
model_list = ["qwen3-0.6b"] # 只用本地小模型
temperature = 0.2
max_tokens = 800
slow_threshold = 20.0                       # 本地模型20秒算慢
selection_strategy = "random"

[model_task_config.lpmm_rdf_build] # RDF构建模型
model_list = ["qwen3-0.6b"] # 只用本地小模型
temperature = 0.2
max_tokens = 800
slow_threshold = 20.0                       # 本地模型20秒算慢
selection_strategy = "random"
