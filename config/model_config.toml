# 配置文件版本号迭代规则同bot_config.toml

[[api_providers]] # API服务提供商（可以配置多个）
name = "GeminiProxy"                    # API服务商名称（可随意命名，在models的api-provider中需使用这个命名）
base_url = "http://154.193.217.165:3000/v1" # API服务商的BaseURL
api_key = "sk-prlNmubWwsigApmSCu6OgGGybxlTM6eQg0LrxZrXsYXuzcqA"                # API密钥（请替换为实际的API密钥）
client_type = "openai"                  # 请求客户端（可选，默认值为"openai"，使用gimini等Google系模型时请配置为"gemini"）
max_retry = 3                           # 最大重试次数（单个模型API调用失败，最多重试的次数）
timeout = 120                            # API请求超时时间（单位：秒）
retry_interval = 5                      # 重试间隔时间（单位：秒）

[[api_providers]]
