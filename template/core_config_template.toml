[profile_mapping.base_parameters.model_defaults]
small_model_tasks = ["chat_short", "style_polish", "jargon_explain"]
large_model_tasks = ["planner", "knowledge_reasoning", "memory_summary"]
disable_thinking_for = ["local_qwen", "qwen"]
